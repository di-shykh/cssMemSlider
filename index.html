<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="slyle.css" />
    <script src="index.js"></script>
    <title>cssSlider</title>
  </head>
  <body>
    <div class="slider-wrapper">
      <img src="assets/img/3N7Z.gif" alt="" class="slide" />
      <div class="control">
        <p>I'm best of the best</p>
        <div class="radio-row">
          <input type="radio" name="radio" id="0" checked />
          <label for="0" class="input-label" onclick="changeSlide(this)">
          </label>

          <input type="radio" name="radio" id="1" />
          <label for="1" class="input-label" onclick="changeSlide(this)">
          </label>

          <input type="radio" name="radio" id="2" />
          <label for="2" class="input-label" onclick="changeSlide(this)">
          </label>

          <input type="radio" name="radio" id="3" />
          <label for="3" class="input-label" onclick="changeSlide(this)">
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
